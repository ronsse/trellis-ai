# Pre-commit hooks — run on every `git commit`.
#
# First-time setup (after cloning the repo):
#     make setup              # installs [dev,vectors] deps AND registers the hook
# Or manually:
#     pip install pre-commit
#     pre-commit install
#
# Manual run across the whole repo (hooks normally only scan staged files):
#     pre-commit run --all-files
#
# The same ruff + mypy commands also run in CI (see .github/workflows/).
# Catching issues locally avoids round-trip failures on push.
#
# TOOL VERSIONS: pyproject.toml [dev] is the single source of truth. The two
# `rev:` values below are MIRRORS of it — pre-commit's `rev` cannot reference
# another file, so this duplication is unavoidable. It is not asserted to be
# in sync; `scripts/check_tool_pins.py` FAILS CI when it is not. If you bump a
# pin, bump it in pyproject.toml and run that script — it names the edit.

repos:
  - repo: https://github.com/astral-sh/ruff-pre-commit
    # mirror of pyproject.toml [dev] ruff pin — enforced by scripts/check_tool_pins.py
    rev: v0.16.4
    hooks:
      - id: ruff-format
      - id: ruff
        args: [--fix]

  - repo: https://github.com/pre-commit/mirrors-mypy
    # mirror of pyproject.toml [dev] mypy pin — enforced by scripts/check_tool_pins.py
    rev: v2.3.1
    hooks:
      - id: mypy
        args: [--ignore-missing-imports]
        additional_dependencies:
          - pydantic>=2.0
          - types-PyYAML
        pass_filenames: false
        entry: mypy src/

  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
      - id: check-toml
      - id: check-merge-conflict
      - id: check-added-large-files
        args: [--maxkb=500]
      - id: detect-private-key
      - id: mixed-line-ending
        args: [--fix=lf]

# Pre-commit hooks — run on every `git commit`.
#
# First-time setup (after cloning the repo):
#     make setup              # installs [dev,vectors] deps AND registers the hook
# Or manually:
#     pip install pre-commit
#     pre-commit install
#
# Manual run across the whole repo (hooks normally only scan staged files):
#     pre-commit run --all-files
#
# The same ruff + mypy commands also run in CI (see .github/workflows/).
# Catching issues locally avoids round-trip failures on push.
#
# TOOL VERSIONS: pyproject.toml [dev] is the ONLY pin for ruff and mypy. Their
# hooks are `repo: local` with `language: system`, so they run the ruff and
# mypy installed from `.[dev]` and carry no `rev:` of their own. A remote
# ruff-pre-commit / mirrors-mypy repo would add a second pin that Dependabot's
# pip updates never touch, failing every tool bump until a human edited it
# (#649, #1268, #1300). `scripts/check_tool_pins.py` FAILS CI if one comes back.
# Consequence: activate the dev venv (or put its bin/ on PATH) before
# `git commit`; a missing ruff or mypy fails the hook loudly.

repos:
  - repo: local
    hooks:
      - id: ruff-format
        name: ruff format
        entry: ruff format --force-exclude
        language: system
        types_or: [python, pyi, jupyter]
        require_serial: true
      - id: ruff
        name: ruff check
        entry: ruff check --force-exclude
        args: [--fix]
        language: system
        types_or: [python, pyi, jupyter]
        require_serial: true
      - id: mypy
        name: mypy
        entry: mypy src/
        args: [--ignore-missing-imports]
        language: system
        types_or: [python, pyi]
        pass_filenames: false
        require_serial: true

  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
      - id: check-toml
      - id: check-merge-conflict
      - id: check-added-large-files
        args: [--maxkb=500]
      - id: detect-private-key
      - id: mixed-line-ending
        args: [--fix=lf]

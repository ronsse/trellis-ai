name: Live infrastructure tests

# Runs the suites that exercise real Bolt/openCypher (Neo4j + ArcadeDB) and
# Postgres backends so connection-pool, Cypher / SCD-2, vector-index,
# cross-store wiring, and wipe-helper regressions surface in CI rather than
# at deploy time. All backends run as ephemeral **service containers**, so the job
# is hermetic and depends on no external managed instance.
#
# Previously this job pointed at a managed Neo4j AuraDB Free instance + a
# Neon Postgres project via repo secrets. AuraDB Free auto-deletes idle
# instances, so the host silently stopped resolving and took the whole
# suite red (DNS ServiceUnavailable) with no code regression. Containers
# remove that dependency entirely.
#
# Coverage tradeoff: managed-cloud-only behaviour (AuraDB's async vector-
# index provisioning, TLS bolt+s routing, Neon connection limits) is not
# exercised here. The store fixtures already wait on db.awaitIndexes, so
# the core wiring is covered; cloud-specific quirks are validated at
# deploy time.
#
# Triggered on pull request and on push to main, plus workflow_dispatch.
# No periodic schedule — the containers are recreated each run, so there
# is nothing to drift.
#
# **Why this runs on pull_request.** It used to run on push-to-main only,
# which meant every test it owns — the loop suite, the graph/vector store
# contracts, the Neo4j e2e suite, the pgvector suite — was verified only
# *after* merge. `tests.yml` is the PR check and `pyproject.toml`'s
# `addopts` deselects the `live` / `slow` / `neo` / `postgres` /
# `pgvector` markers those tests carry, so the PR was green by
# construction and `main` broke on merge. That is how #380 (the noise
# demotion evidence gate) shipped against two loop fixtures encoding the
# behaviour it deliberately removed: green PR, red main, thirteen
# consecutive failed runs and an alert on every merge.
#
# The cost is small and was measured, not assumed: the pytest step is
# ~90s and the whole job 2m30s-3m40s wall (the wider end is this
# workflow's own first `pull_request` run), and it needs no secrets
# (both backends are service containers), so it works on fork PRs. Run
# history before the #380 breakage is 36 consecutive green with one
# infrastructure `startup_failure` — this is not a flaky job being
# promoted into the merge path.
#
# Deliberately NOT path-filtered. A filter would have to name most of
# `src/` to cover what these tests reach — #380 touched `classify/`,
# `retrieve/` and `trellis_api/routes/` for a defect that surfaced in
# `tests/integration/loops/` — and a filter that misses is this same bug
# with extra steps. At three-and-a-bit minutes, running it always is
# cheaper than maintaining the list of paths that matter.
#
# Note this workflow appearing on a PR does not by itself *block* the
# merge: `main`'s branch protection carries no `required_status_checks`
# at all. Making it blocking is a repo-settings change, not a file.

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

# A PR branch that is pushed to repeatedly should not queue up runs of a
# service-container job, so PR runs coalesce by ref and supersede each
# other.
#
# **Pushes to `main` are grouped by SHA, one group each — and that is
# load-bearing, not cosmetic.** `cancel-in-progress: false` protects a
# run that has already *started*; it does nothing for a *pending* one.
# GitHub cancels any previously pending run when a third queues into the
# same group, so a single shared `main` group would silently drop the
# middle merge's verification and report it grey "cancelled" rather than
# red. This job takes 144-217s and merges land closer together than that
# (2026-08-28T02:38:48 ran 160s; the next push came 116s later), so the
# collision is routine, not theoretical — and an unverified commit
# wearing a non-red status is exactly the green-by-construction failure
# this workflow was put on `pull_request` to close.
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'pull_request' && github.ref || github.sha }}
  # Redundant for `main` now that each push owns its group, and kept as
  # the second lock: if the group expression above is ever simplified
  # back to a shared key, this still refuses to cancel a merge.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  live-infra:
    name: live-infra (containerized Neo4j + ArcadeDB + Postgres)
    runs-on: ubuntu-latest
    timeout-minutes: 20

    services:
      # ArcadeDB is the blessed graph + vector substrate. The graph contract
      # uses Bolt, which is an opt-in server plugin; HTTP creates the throwaway
      # database and runs schema DDL. Its Bolt port maps to 17687 because
      # Neo4j already owns 7687 on the runner.
      arcadedb:
        image: arcadedata/arcadedb:26.8.1
        env:
          JAVA_OPTS: >-
            -Darcadedb.server.rootPassword=playwithdata
            -Darcadedb.server.plugins=Bolt:com.arcadedb.bolt.BoltProtocolPlugin
        ports:
          - 2480:2480
          - 17687:7687
        options: >-
          --health-cmd "wget --spider -q http://localhost:2480/api/v1/ready || exit 1"
          --health-interval 10s
          --health-timeout 10s
          --health-retries 30
          --health-start-period 30s

      # Neo4j 2025.12 (community) — the version the shape #2 vector store
      # documents for self-hosted use. Community runs the full graph + SCD-2
      # suite. The five Cypher SEARCH vector-search tests self-skip here: that
      # clause is AuraDB-grade and absent from self-hosted Docker, so a
      # session-scoped probe in tests/conftest.py runs the real query shape
      # once and skips them when it fails. The reason it fails is version-
      # dependent and this image is the milder case — a server that resolves
      # the clause raises 51N26 "not supported", while THIS one defaults to
      # Cypher 5 and rejects the keyword at parse time (`Invalid input
      # 'SEARCH'`), which is why the probe classifies on both. #356 moved that
      # probe up from the integration conftest so the unit suite shares it.
      # NEO4J_AUTH sets the initial password so
      # there's no forced first-login change. The credentials are a literal
      # throwaway pair: the container is reachable only on the runner's
      # loopback, so there is nothing to keep secret.
      neo4j:
        image: neo4j:2025.12
        env:
          NEO4J_AUTH: neo4j/trellistestpw
        ports:
          - 7687:7687
          - 7474:7474
        options: >-
          --health-cmd "cypher-shell -u neo4j -p trellistestpw 'RETURN 1'"
          --health-interval 10s
          --health-timeout 10s
          --health-retries 30
          --health-start-period 30s

      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: trellis
          POSTGRES_PASSWORD: trellis
          POSTGRES_DB: trellis
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U trellis"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 15

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
          cache: pip

      - name: Install Trellis with live-infra extras
        run: pip install -e ".[dev,cloud,neo4j]"

      # Do not CREATE EXTENSION here. ``PgVectorStore`` now runs
      # ``CREATE EXTENSION IF NOT EXISTS vector`` on a plain connection
      # (``_provision_vector_extension``) before ``super().__init__``
      # opens the pool with ``register_vector`` as ``on_connect``. The
      # pgvector/pgvector:pg16 image ships the extension files but does
      # not create the extension in ``POSTGRES_DB``; the store must do
      # that. If this workflow step comes back, #350 has regressed —
      # live-infra would stay green even if store bootstrap were deleted.

      - name: Run live + contract suites against the containers
        env:
          TRELLIS_TEST_NEO4J_URI: bolt://localhost:7687
          TRELLIS_TEST_NEO4J_USER: neo4j
          TRELLIS_TEST_NEO4J_PASSWORD: trellistestpw
          TRELLIS_TEST_NEO4J_DATABASE: neo4j
          TRELLIS_TEST_PG_DSN: postgresql://trellis:trellis@localhost:5432/trellis
          TRELLIS_TEST_ARCADEDB: "1"
          TRELLIS_TEST_ARCADEDB_URI: bolt://localhost:17687
          TRELLIS_TEST_ARCADEDB_HTTP_URL: http://localhost:2480
          TRELLIS_TEST_ARCADEDB_USER: root
          TRELLIS_TEST_ARCADEDB_PASSWORD: playwithdata
          TRELLIS_TEST_ARCADEDB_DATABASE: trellis_test
          # Backend-marked tests are deselected by default (tests/conftest.py);
          # these toggles opt the gated suites in. The loop suites are marked
          # live + slow + neo4j + postgres, so those four are needed for them;
          # `pgvector` and `arcadedb` select their backend suites independently.
          TRELLIS_TEST_LIVE: "1"
          TRELLIS_TEST_SLOW: "1"
          TRELLIS_TEST_NEO: "1"
          TRELLIS_TEST_POSTGRES: "1"
          TRELLIS_TEST_PGVECTOR: "1"
        # The contract suites (tests/unit/stores/contracts/) run the shared
        # ABC semantics against every configured backend — that's where
        # cross-backend drift (e.g. issue #195 edge re-ingest) surfaces.
        # GraphStoreContractTests covers Postgres + Neo4j + ArcadeDB here;
        # VectorStoreContractTests covers pgvector, which is the production
        # vector backend and whose contract had never executed anywhere
        # before #345 — its fixture predated the connection-pool refactor
        # (#84) and called ``_conn`` as an attribute rather than the
        # context-manager method it became.
        #
        # tests/unit/stores/test_pgvector.py is named explicitly because it
        # carried the same dead fixture as the contract file and is the other
        # half of the pgvector surface. It is NOT covered by the contracts
        # directory.
        #
        # The two Postgres store suites are named explicitly because tests.yml
        # deselects their backend marker even in its all-extras leg.
        #
        # tests/unit/stores/test_neo4j_vector.py was excluded until #356
        # because four of its TestQuery cases issue the AuraDB-grade
        # `SEARCH ... IN (VECTOR INDEX ...)` clause, which the neo4j:2025.12
        # container above rejects at parse time (`Invalid input 'SEARCH'`).
        # Those four now take the `require_neo4j_vector_search` gate in
        # tests/conftest.py, which probes the connected instance once and
        # skips them; measured against this exact image, the file runs
        # 24 passed / 4 skipped where it was previously 4 failed / 23 never
        # executed by any workflow. The 24 are the point — deleting the four
        # would have bought the same green with none of the coverage.
        #
        # The SEARCH clause was not the only reason it could not be added.
        # This suite and tests/integration/test_neo4j_e2e.py now share one
        # Neo4j, and Neo4j holds exactly one vector index per (label,
        # property): they named different indexes on (:Node, embedding), and
        # a second `CREATE VECTOR INDEX ... IF NOT EXISTS` is discarded with
        # no error and no warning, so the second suite to run would have
        # failed every test 30s later in wait_for_vector_index_online, naming
        # an index that SHOW INDEXES does not list. The unit suite now takes
        # the store's production-default name, which is what the e2e conftest
        # already pinned; tests/unit/test_neo4j_vector_live_infra_rule.py
        # fails if they diverge. Measured on this image, in this order, from
        # a fresh container: 29 passed, 5 skipped.
        #
        # Still do NOT widen this to all of tests/unit/stores/. Paths here are
        # reviewed one at a time, and tests/unit/test_postgres_live_infra_rule.py
        # pins this exact set so a sweep fails rather than quietly enrolling a
        # suite nobody checked against these containers.
        run: |
          pytest \
            tests/integration/test_neo4j_e2e.py \
            tests/integration/loops/ \
            tests/unit/stores/contracts/ \
            tests/unit/stores/test_neo4j_vector.py \
            tests/unit/stores/test_pgvector.py \
            tests/unit/stores/test_postgres_stores.py \
            tests/unit/stores/test_api_key_store.py \
            -v

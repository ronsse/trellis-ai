name: Lint

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
      # Keep in sync with the ruff pin in pyproject.toml [dev] and .pre-commit-config.yaml
      - run: pip install "ruff==0.15.22"
      - run: ruff check src/ tests/
      # Formatting drifted to 25 files before this gate existed: `make format`
      # was available but nothing enforced it, so a PR could add unformatted
      # code and stay green. Checked separately from `ruff check` so the failure
      # message names formatting rather than lint.
      - run: ruff format --check src/ tests/

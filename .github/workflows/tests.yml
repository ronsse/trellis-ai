name: Tests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - python-version: "3.11"
            extras: dev
          - python-version: "3.12"
            extras: dev
          - python-version: "3.13"
            extras: dev
          - python-version: "3.13"
            extras: dev,all
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - run: pip install -e ".[${{ matrix.extras }}]"
      # `-n auto` is set here and nowhere else: not in pyproject addopts or the
      # Makefile, so a local `make test` stays one process.
      - run: pytest tests/ -v -n auto

    RuntimeResponse:
      additionalProperties: false
      description: 'Response body for ``GET /api/v1/runtime`` — the admin Runtime panel.


        A read-only snapshot of this process''s effective configuration,

        sourced from the same resolvers the behaviour itself consults

        (``trellis_api.auth.resolve_auth_mode``,

        ``trellis_api.routes.health.resolve_ops_detail``,

        ``trellis_api.observability.resolve_metrics_public``,

        ``trellis_api.app.get_bind_info``) so this view can never drift from

        what a real request gets.


        Deliberately excludes anything secret-shaped: ``stores`` is class

        names only, ``embedder`` names only the configuration knob in play

        (never a key or URL), ``llm_routes`` carries tier names only (never a

        provider base URL, credential source, or API-key env name), and the

        two directory fields are plain filesystem paths with no embedded

        credentials. See ``tests/unit/api/test_runtime_route.py``''s

        secret-leakage test for the seeded-secret assertion backing that

        claim.'
      properties:
        auth_mode:
          title: Auth Mode
          type: string
        auth_mode_permissive:
          description: True when a request presenting no credential is granted every scope (auth mode 'off' or 'optional')
            — the exact condition the UI's warning banner fires on.
          title: Auth Mode Permissive
          type: boolean
        bind_host:
          title: Bind Host
          type: string
        bind_port:
          title: Bind Port
          type: integer
        embedder:
          anyOf:
          - type: string
          - type: 'null'
          description: Which knob registry.embedding_fn resolved from (TRELLIS_EMBEDDING_FN or embeddings.provider), the same
            resolver every retrieval surface calls; null when neither is set. 'unknown (...)' when the knob is set but failed
            to resolve -- never a key or URL.
          title: Embedder
        host_jobs_dir:
          anyOf:
          - type: string
          - type: 'null'
          description: TRELLIS_HOST_JOBS_DIR as seen by this process. Only the host job dispatcher (docs/ops/job-dispatcher.sh.example)
            resolves an executable path under it — this process never reads the directory itself, so a null here means the
            variable is unset in this process's environment, not that host-only jobs are unconfigured.
          title: Host Jobs Dir
        learning_artifacts_dir:
          anyOf:
          - type: string
          - type: 'null'
          title: Learning Artifacts Dir
        llm_routes:
          additionalProperties:
            anyOf:
            - type: string
            - type: 'null'
          description: 'Tier name each LLM consumer routes to, keyed by consumer name; null means the consumer is unrouted
            (falls back to the parent llm: block).'
          title: Llm Routes
          type: object
        llm_routes_error:
          anyOf:
          - type: string
          - type: 'null'
          description: Set instead of llm_routes when llm.routes is malformed.
          title: Llm Routes Error
        metrics_public:
          title: Metrics Public
          type: boolean
        ops_detail:
          title: Ops Detail
          type: string
        stores:
          additionalProperties:
            type: string
          description: Backend class name per store, keyed by store name.
          title: Stores
          type: object
      required:
      - auth_mode
      - auth_mode_permissive
      - ops_detail
      - metrics_public
      - bind_host
      - bind_port
      title: RuntimeResponse
      type: object

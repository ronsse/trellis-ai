components:
  schemas:
    AdminJobLastRun:
      additionalProperties: false
      description: 'Most recent job-run record for one catalog job, from the EventLog.


        Derived from the latest ``JOB_RUN_STARTED`` / ``JOB_RUN_COMPLETED``

        pair (see ``trellis admin record-job-run``) — never a hardcoded

        literal. All fields ``None`` together means the job has no run

        record the EventLog can see (never run, or run before this build).

        ``started_at`` can be present with the rest ``None`` when a run

        started but the dispatcher never called ``record-job-run`` to close

        it out (crashed before reporting).'
      properties:
        duration_ms:
          anyOf:
          - type: integer
          - type: 'null'
          title: Duration Ms
        exit_code:
          anyOf:
          - type: integer
          - type: 'null'
          title: Exit Code
        finished_at:
          anyOf:
          - type: string
          - type: 'null'
          title: Finished At
        run_id:
          anyOf:
          - type: string
          - type: 'null'
          title: Run Id
        started_at:
          anyOf:
          - type: string
          - type: 'null'
          title: Started At
        status:
          anyOf:
          - type: string
          - type: 'null'
          title: Status
      title: AdminJobLastRun
      type: object
    AdminJobListResponse:
      additionalProperties: false
      description: 'Response for ``GET /api/v1/admin/jobs``.


        ``dispatcher_last_seen_at`` is the most recent ``JOB_RUN_STARTED``

        across every catalog job — the only signal this server has that

        *some* dispatcher is polling ``due-jobs`` at all. ``dispatcher_seen``

        is the boolean a UI banner reads directly (recently seen within a

        server-chosen window) rather than re-deriving a staleness threshold

        client-side; ``False`` with ``dispatcher_last_seen_at is None`` means

        no dispatcher has ever reported. ``store_degradation`` is ``None``

        on a clean read and otherwise the same shape ``GET /api/v1/policies``

        and ``GET /api/v1/advisories`` already use (``LoadDegradation.

        to_dict()``, recovery command included) — a caller reading only

        ``jobs``/``count`` would otherwise see catalog defaults presented as

        the operator''s own stored choices with no signal that the file

        behind them is damaged.'
      properties:
        count:
          default: 0
          title: Count
          type: integer
        dispatcher_last_seen_at:
          anyOf:
          - type: string
          - type: 'null'
          title: Dispatcher Last Seen At
        dispatcher_seen:
          default: false
          title: Dispatcher Seen
          type: boolean
        jobs:
          items:
            $ref: '#/components/schemas/AdminJobSummary'
          title: Jobs
          type: array
        store_degradation:
          anyOf:
          - additionalProperties: true
            type: object
          - type: 'null'
          title: Store Degradation
      title: AdminJobListResponse
      type: object
    AdminJobPatchRequest:
      additionalProperties: false
      description: 'Body for ``PATCH /api/v1/admin/jobs/{name}``.


        Every field is optional with no sentinel beyond Pydantic''s own

        ``model_fields_set``: the route reads which fields were actually

        present in the request body (vs omitted) so a ``PATCH`` changes only

        what the caller named — sending ``"cadence": null`` explicitly

        clears cadence (makes the job manual-only); omitting ``cadence``

        leaves it unchanged. ``extra="forbid"`` (:class:`WireRequestModel`)

        refuses any other field name outright, including a command, argv,

        path or environment variable — there is no such field here to

        forbid *selectively*, which is the point.'
      properties:
        cadence:
          anyOf:
          - type: string
          - type: 'null'
          title: Cadence
        enabled:
          anyOf:
          - type: boolean
          - type: 'null'
          title: Enabled
        timeout_seconds:
          anyOf:
          - maximum: 86400.0
            minimum: 1.0
            type: integer
          - type: 'null'
          title: Timeout Seconds
      title: AdminJobPatchRequest
      type: object
    AdminJobPatchResponse:
      additionalProperties: false
      description: Response for a successful ``PATCH /api/v1/admin/jobs/{name}``.
      properties:
        job:
          $ref: '#/components/schemas/AdminJobSummary'
        status:
          default: ok
          title: Status
          type: string
      required:
      - job
      title: AdminJobPatchResponse
      type: object
    AdminJobRunResponse:
      additionalProperties: false
      description: 'Response for ``POST /api/v1/admin/jobs/{name}/run``.


        Never claims synchronous execution: the write sets

        ``run_requested_at`` and nothing else runs inline.

        ``dispatcher_hint`` is the fixed, honest sentence a UI shows beside

        the confirm — a host dispatcher polling for due jobs on its own

        cadence is what actually executes the job, if one is installed.

        ``run_requested_at`` is exactly what the re-read row carries —

        ``None`` on the (expected-unreachable, since a non-success result

        raises before this is built) chance the handler''s own write did not

        stick — never a timestamp this route or the CLI computed itself,

        which would report a value the handler never wrote.'
      properties:
        dispatcher_hint:
          default: Accepted. A host dispatcher, if one is installed, picks this up on its next poll, typically within ~5 minutes.
          title: Dispatcher Hint
          type: string
        name:
          title: Name
          type: string
        run_requested_at:
          anyOf:
          - type: string
          - type: 'null'
          title: Run Requested At
        status:
          default: ok
          title: Status
          type: string
      required:
      - name
      - run_requested_at
      title: AdminJobRunResponse
      type: object
    AdminJobSummary:
      additionalProperties: false
      description: 'One job: catalog identity joined with its schedule-registry row.


        ``name``, ``description``, ``host_only``, ``spends_llm`` and

        ``heavy`` are fixed catalog facts (source-reviewed, never writable

        over this API). ``enabled``, ``cadence``, ``timeout_seconds`` and

        ``run_requested_at`` are the mutable schedule-registry row —

        materialized with catalog defaults when no row has been written

        yet, so a job always appears here even before ``init-schedule`` or

        a first ``PATCH``. ``stored`` is ``False`` for exactly that

        materialized-default case (including a row that failed to parse

        out of a degraded store): the catalog default shown is never the

        operator''s own choice, and ``next_due_at`` is always ``None`` for

        such a row — ``due-jobs`` only ever evaluates a *stored* row, so a

        catalog default could never actually fire at the time this field

        would otherwise claim. ``default_cadence`` is the catalog''s own

        default, shown alongside the effective ``cadence`` so an operator

        can tell "customized" from "still the catalog default" without a

        second request. ``next_due_at`` is a display-only estimate

        (``None`` for a manual-only job, a job with no stored row, or when

        no tick could be found).'
      properties:
        cadence:
          anyOf:
          - type: string
          - type: 'null'
          title: Cadence
        default_cadence:
          anyOf:
          - type: string
          - type: 'null'
          title: Default Cadence
        description:
          title: Description
          type: string
        enabled:
          title: Enabled
          type: boolean
        heavy:
          title: Heavy
          type: boolean
        host_only:
          title: Host Only
          type: boolean
        last_run:
          anyOf:
          - $ref: '#/components/schemas/AdminJobLastRun'
          - type: 'null'
        loops:
          items:
            type: string
          title: Loops
          type: array
        name:
          title: Name
          type: string
        next_due_at:
          anyOf:
          - type: string
          - type: 'null'
          title: Next Due At
        run_requested_at:
          anyOf:
          - type: string
          - type: 'null'
          title: Run Requested At
        spends_llm:
          title: Spends Llm
          type: boolean
        stored:
          default: true
          title: Stored
          type: boolean
        timeout_seconds:
          title: Timeout Seconds
          type: integer
      required:
      - name
      - description
      - host_only
      - spends_llm
      - heavy
      - enabled
      - timeout_seconds
      title: AdminJobSummary
      type: object
    AxisReportResponse:
      additionalProperties: false
      description: 'Which retrieval axes this pack has, ran, and did not.


        Mirrors :class:`trellis.retrieve.builder_factory.AxisReport`: axis names

        and states only, never an exception message. ``embedder_error_type`` and

        ``embedder_setting`` are non-``None`` only when ``semantic ==

        "embedder_failed"`` (Q5-A); default to ``None`` so a client built

        against an older server still parses this model.'
      properties:
        available:
          items:
            type: string
          title: Available
          type: array
        embedder_error_type:
          anyOf:
          - type: string
          - type: 'null'
          title: Embedder Error Type
        embedder_setting:
          anyOf:
          - type: string
          - type: 'null'
          title: Embedder Setting
        failed:
          items:
            type: string
          title: Failed
          type: array
        graph:
          default: ran
          title: Graph
          type: string
        ran:
          items:
            type: string
          title: Ran
          type: array
        semantic:
          title: Semantic
          type: string
      required:
      - available
      - ran
      - failed
      - semantic
      title: AxisReportResponse
      type: object
    BackendHealth:
      additionalProperties: false
      description: One backend's probe outcome — mirrors ``/readyz``'s per-backend shape.
      properties:
        error:
          anyOf:
          - type: string
          - type: 'null'
          title: Error
        latency_ms:
          anyOf:
          - type: number
          - type: 'null'
          title: Latency Ms
        status:
          title: Status
          type: string
      required:
      - status
      title: BackendHealth
      type: object
    BatchCommandBodyError:
      additionalProperties: false
      description: '``/commands/batch`` 422: the request body failed pydantic validation.


        Same shape as every other route''s default 422 (FastAPI''s own

        ``HTTPValidationError``) -- declared separately here, rather than

        reusing that name, because ``/commands/batch`` also documents a

        second, differently-shaped 422 cause (:class:`BatchOperationNameError`)

        under the same status code, via ``anyOf``.'
      properties:
        detail:
          items:
            $ref: '#/components/schemas/BatchCommandBodyErrorItem'
          title: Detail
          type: array
      required:
      - detail
      title: BatchCommandBodyError
      type: object
    BatchCommandBodyErrorItem:
      additionalProperties: false
      description: 'One pydantic field error, mirroring FastAPI''s own validation-error shape.


        FastAPI''s ``ValidationError`` items always carry ``input`` (the value

        that failed) and, for some error types (e.g. a wrong-type error),

        ``ctx`` (extra context such as the expected type). Both are declared

        here so a real 422 validates against this model -- ``extra="forbid"``

        on :class:`~trellis_wire.base.WireModel` otherwise rejects every real

        response, since pydantic always emits ``input`` and often emits

        ``ctx``.'
      properties:
        ctx:
          anyOf:
          - additionalProperties: true
            type: object
          - type: 'null'
          title: Ctx
        input:
          title: Input
        loc:
          items:
            anyOf:
            - type: string
            - type: integer
          title: Loc
          type: array
        msg:
          title: Msg
          type: string
        type:
          title: Type
          type: string
      required:
      - loc
      - msg
      - type
      title: BatchCommandBodyErrorItem
      type: object
    BatchCommandItem:
      additionalProperties: false
      description: A single command within a batch request.
      properties:
        args:
          additionalProperties: true
          title: Args
          type: object
        idempotency_key:
          anyOf:
          - type: string
          - type: 'null'
          title: Idempotency Key
        metadata:
          additionalProperties: true
          title: Metadata
          type: object
        operation:
          title: Operation
          type: string
        target_id:
          anyOf:
          - type: string
          - type: 'null'
          title: Target Id
        target_type:
          anyOf:
          - type: string
          - type: 'null'
          title: Target Type
      required:
      - operation
      title: BatchCommandItem
      type: object
    BatchCommandRequest:
      additionalProperties: false
      description: Request to execute a batch of mutation commands.
      properties:
        commands:
          items:
            $ref: '#/components/schemas/BatchCommandItem'
          title: Commands
          type: array
        metadata:
          additionalProperties: true
          title: Metadata
          type: object
        requested_by:
          default: api:mutations
          title: Requested By
          type: string
        strategy:
          default: stop_on_error
          title: Strategy
          type: string
      required:
      - commands
      title: BatchCommandRequest
      type: object
    BatchCommandResponse:
      additionalProperties: false
      description: Response after executing a batch of mutation commands.
      properties:
        batch_id:
          title: Batch Id
          type: string
        duplicates:
          title: Duplicates
          type: integer
        executed:
          title: Executed
          type: integer
        failed:
          title: Failed
          type: integer
        rejected:
          title: Rejected
          type: integer
        results:
          items:
            $ref: '#/components/schemas/CommandResponse'
          title: Results
          type: array
        status:
          default: ok
          title: Status
          type: string
        strategy:
          title: Strategy
          type: string
        succeeded:
          title: Succeeded
          type: integer
        total:
          title: Total
          type: integer
      required:
      - batch_id
      - strategy
      - total
      - executed
      - succeeded
      - failed
      - rejected
      - duplicates
      - results
      title: BatchCommandResponse
      type: object
    BatchOperationNameError:
      additionalProperties: false
      description: '``/commands/batch`` 422: a command named an operation outside the

        :class:`~trellis.mutate.Operation` enum.


        ``_parse_operation`` catches ``Operation(value)``''s ``ValueError`` and

        raises a plain-string-``detail`` ``HTTPException`` naming the bad

        value and the valid vocabulary -- not the list-of-field-errors shape

        pydantic body validation produces, so it needs its own model rather

        than a ``$ref`` to ``HTTPValidationError``.'
      properties:
        detail:
          title: Detail
          type: string
      required:
      - detail
      title: BatchOperationNameError
      type: object
    BatchStrategy:
      description: 'How a mutation batch handles per-item failures.


        Wire-level duplicate of :class:`trellis.mutate.commands.BatchStrategy`.'
      enum:
      - sequential
      - stop_on_error
      - continue_on_error
      title: BatchStrategy
      type: string
    BulkAliasItem:
      additionalProperties: false
      description: A single alias in a bulk ingest request.
      properties:
        entity_id:
          title: Entity Id
          type: string
        is_primary:
          default: false
          title: Is Primary
          type: boolean
        match_confidence:
          default: 1.0
          title: Match Confidence
          type: number
        raw_id:
          title: Raw Id
          type: string
        raw_name:
          anyOf:
          - type: string
          - type: 'null'
          title: Raw Name
        source_system:
          title: Source System
          type: string
      required:
      - entity_id
      - source_system
      - raw_id
      title: BulkAliasItem
      type: object
    BulkEdgeItem:
      additionalProperties: false
      description: 'A single edge in a bulk ingest request.


        Inherits base edge fields from ``LinkRequest`` and adds an optional

        per-item ``idempotency_key``. Overrides ``properties`` to default to

        an empty dict (``LinkRequest`` defaults to ``None``).'
      properties:
        allow_dangling:
          default: false
          title: Allow Dangling
          type: boolean
        edge_kind:
          default: entity_related_to
          title: Edge Kind
          type: string
        idempotency_key:
          anyOf:
          - type: string
          - type: 'null'
          title: Idempotency Key
        properties:
          additionalProperties: true
          title: Properties
          type: object
        source_id:
          title: Source Id
          type: string
        target_id:
          title: Target Id
          type: string
      required:
      - source_id
      - target_id
      title: BulkEdgeItem
      type: object
    BulkEntityItem:
      additionalProperties: false
      description: 'A single entity in a bulk ingest request.


        Inherits base entity fields from ``EntityCreateRequest`` and adds

        ``node_role``, ``generation_spec`` (for curated nodes), and an

        optional per-item ``idempotency_key``.'
      properties:
        entity_id:
          anyOf:
          - type: string
          - type: 'null'
          title: Entity Id
        entity_type:
          title: Entity Type
          type: string
        generation_spec:
          anyOf:
          - additionalProperties: true
            type: object
          - type: 'null'
          title: Generation Spec
        idempotency_key:
          anyOf:
          - type: string
          - type: 'null'
          title: Idempotency Key
        name:
          title: Name
          type: string
        node_role:
          $ref: '#/components/schemas/NodeRole'
          default: semantic
        properties:
          additionalProperties: true
          title: Properties
          type: object
      required:
      - entity_type
      - name
      title: BulkEntityItem
      type: object
    BulkGroupResult:
      additionalProperties: false
      description: Aggregated results for one group (entities, edges, or aliases).
      properties:
        duplicates:
          default: 0
          title: Duplicates
          type: integer
        failed:
          default: 0
          title: Failed
          type: integer
        rejected:
          default: 0
          title: Rejected
          type: integer
        results:
          items:
            $ref: '#/components/schemas/BulkItemResult'
          title: Results
          type: array
        skipped:
          default: 0
          title: Skipped
          type: integer
        succeeded:
          default: 0
          title: Succeeded
          type: integer
        total:
          default: 0
          title: Total
          type: integer
      title: BulkGroupResult
      type: object
    BulkIngestRequest:
      additionalProperties: false
      description: 'Bulk ingest request carrying entities, edges, and aliases.


        Processed in order: entities → edges → aliases (edges and aliases

        reference entities, so entities must land first). Default strategy is

        ``continue_on_error`` — the common backfill case where partial success

        is acceptable and the caller wants a full per-item report.'
      properties:
        aliases:
          items:
            $ref: '#/components/schemas/BulkAliasItem'
          title: Aliases
          type: array
        edges:
          items:
            $ref: '#/components/schemas/BulkEdgeItem'
          title: Edges
          type: array
        entities:
          items:
            $ref: '#/components/schemas/BulkEntityItem'
          title: Entities
          type: array
        requested_by:
          default: api:bulk-ingest
          title: Requested By
          type: string
        strategy:
          $ref: '#/components/schemas/BatchStrategy'
          default: continue_on_error
      title: BulkIngestRequest
      type: object
    BulkIngestResponse:
      additionalProperties: false
      description: Response for a bulk ingest request.
      properties:
        aliases:
          $ref: '#/components/schemas/BulkGroupResult'
        batch_id:
          title: Batch Id
          type: string
        edges:
          $ref: '#/components/schemas/BulkGroupResult'
        entities:
          $ref: '#/components/schemas/BulkGroupResult'
        status:
          default: ok
          title: Status
          type: string
        strategy:
          title: Strategy
          type: string
      required:
      - batch_id
      - strategy
      title: BulkIngestResponse
      type: object
    BulkItemResult:
      additionalProperties: false
      description: Per-item result within a bulk ingest group.
      properties:
        id:
          anyOf:
          - type: string
          - type: 'null'
          title: Id
        message:
          default: ''
          title: Message
          type: string
        name:
          anyOf:
          - type: string
          - type: 'null'
          title: Name
        status:
          title: Status
          type: string
      required:
      - status
      title: BulkItemResult
      type: object
    ClassPriorWithheldDetail:
      additionalProperties: false
      description: 'One (document form, retrieval axis) pair the class-prior gate withheld.


        Counts only, same posture as the rest of :class:`WithholdingResponse` —

        ``form``/``axis`` name the class and the axis the prior was scoped to,

        never an item id or excerpt.'
      properties:
        axis:
          title: Axis
          type: string
        count:
          title: Count
          type: integer
        form:
          title: Form
          type: string
      required:
      - form
      - axis
      - count
      title: ClassPriorWithheldDetail
      type: object
    ClassificationSetRequest:
      additionalProperties: false
      description: 'Request to relabel one document''s sensitivity. ``doc_id`` rides the URL path.


        ``sensitivity`` is the closed ``DataClassification`` vocabulary, lowest to

        highest. A key needs the ``confidential`` (or ``restricted``/``admin``)

        scope to touch a document at that label, or to assign it.'
      properties:
        requested_by:
          default: api:classify-sensitivity
          title: Requested By
          type: string
        sensitivity:
          enum:
          - public
          - internal
          - confidential
          - restricted
          title: Sensitivity
          type: string
      required:
      - sensitivity
      title: ClassificationSetRequest
      type: object
    ClassifyCandidate:
      additionalProperties: false
      description: 'One mined ``tag_keyword`` or ``domain_alias`` candidate, latest emission only.


        ``kind`` is ``"tag_keyword"`` (``key`` = keyword, ``target`` = domain

        tag) or ``"domain_alias"`` (``key`` = alias, ``target`` = canonical

        tag). ``status`` is ``"open"``, ``"applied"`` (an overlay row exists

        for this ``(kind, key)``) or ``"dismissed"`` (a

        ``CLASSIFY_CANDIDATE_DISMISSED`` event postdates this emission).


        ``metrics`` carries the mined candidate''s own kind-specific fields

        verbatim from its ``to_event_payload()`` -- ``support``/``precision``/

        ``recall``/``lift``/``has_write_target`` for ``tag_keyword``;

        ``cooccurrence_rate``/``is_lexical_only``/``documents_gained``/etc. for

        ``domain_alias``. The two kinds'' metric vocabularies differ enough

        that typing each field individually would force every row of one kind

        to carry nulls for the other''s fields; a passthrough dict keeps the

        DTO''s own fields (above) honest about what every row actually has.'
      properties:
        candidate_id:
          title: Candidate Id
          type: string
        emitted_at:
          title: Emitted At
          type: string
        example_count:
          default: 0
          title: Example Count
          type: integer
        key:
          title: Key
          type: string
        kind:
          title: Kind
          type: string
        metrics:
          additionalProperties: true
          title: Metrics
          type: object
        notes:
          items:
            type: string
          title: Notes
          type: array
        recurrence_count:
          default: 0
          title: Recurrence Count
          type: integer
        source_event_id:
          title: Source Event Id
          type: string
        status:
          title: Status
          type: string
        target:
          title: Target
          type: string
      required:
      - candidate_id
      - kind
      - key
      - target
      - status
      - emitted_at
      - source_event_id
      title: ClassifyCandidate
      type: object
    ClassifyCandidateDismissResponse:
      additionalProperties: false
      description: Outcome of dismissing one open candidate.
      properties:
        candidate_id:
          title: Candidate Id
          type: string
        kind:
          anyOf:
          - type: string
          - type: 'null'
          title: Kind
        message:
          anyOf:
          - type: string
          - type: 'null'
          title: Message
        status:
          default: ok
          title: Status
          type: string
      required:
      - candidate_id
      title: ClassifyCandidateDismissResponse
      type: object
    ClassifyCandidateListResponse:
      additionalProperties: false
      description: 'List of mined classify candidates, deduped to their latest emission.


        ``store_degradation`` is the overrides store''s own

        ``LoadDegradation.to_dict()`` (``None`` when the file loaded clean) --

        an applied-row-derived ``"applied"``/``"dismissed"`` status above is

        read from whatever of that file parsed, so a caller rendering this

        list needs the same "is what I''m showing the whole picture?" signal

        ``GET /settings`` and ``GET /policies`` already carry.'
      properties:
        candidates:
          items:
            $ref: '#/components/schemas/ClassifyCandidate'
          title: Candidates
          type: array
        count:
          default: 0
          title: Count
          type: integer
        store_degradation:
          anyOf:
          - additionalProperties: true
            type: object
          - type: 'null'
          title: Store Degradation
      title: ClassifyCandidateListResponse
      type: object
    ClassifyMineRequest:
      additionalProperties: false
      description: 'Body for ``POST /api/v1/classify/candidates/mine``.


        ``use_recommended_defaults`` (default ``True``) mirrors ``trellis

        classify tag-candidates``/``domain-candidates``''s own

        ``_tag_evolution_registry``/``_domain_normalization_registry``: when

        the real, persistent ``ParameterRegistry`` is missing a required

        threshold for a component, mine with that component''s shipped

        ``RECOMMENDED_SEED_VALUES`` instead of hard-failing -- never silent,

        since the response''s ``used_recommended_defaults`` names exactly

        which component(s) this happened for and a ``structlog`` WARN is

        emitted for each. Pin it ``False`` to require every threshold

        pre-seeded (``trellis admin settings`` has no seeding command for

        these yet -- seed via a governed write directly) and get a 400

        naming the missing keys and their recommended values instead of a

        mined set of candidates run against unreviewed defaults.'
      properties:
        kinds:
          items:
            type: string
          title: Kinds
          type: array
        scan_limit:
          anyOf:
          - type: integer
          - type: 'null'
          title: Scan Limit
        use_recommended_defaults:
          default: true
          title: Use Recommended Defaults
          type: boolean
      title: ClassifyMineRequest
      type: object
    ClassifyMineResponse:
      additionalProperties: false
      description: Outcome of one mining run, plus the candidates it just emitted.
      properties:
        candidates:
          items:
            $ref: '#/components/schemas/ClassifyCandidate'
          title: Candidates
          type: array
        domain_alias_count:
          default: 0
          title: Domain Alias Count
          type: integer
        status:
          default: ok
          title: Status
          type: string
        tag_keyword_count:
          default: 0
          title: Tag Keyword Count
          type: integer
        used_recommended_defaults:
          items:
            type: string
          title: Used Recommended Defaults
          type: array
      title: ClassifyMineResponse
      type: object
    ClassifyRuleApplyRequest:
      additionalProperties: false
      description: 'Body for ``POST /api/v1/classify/rules``.


        ``source_event_id`` must name the ``TAG_KEYWORD_CANDIDATE`` /

        ``DOMAIN_ALIAS_CANDIDATE`` event this rule was mined from, so the

        applied overlay row -- and its audit event -- stay traceable back to

        the evidence that justified it. ``support``/``precision``/``lift``

        are copied onto the ``CLASSIFY_RULE_APPLIED`` audit event verbatim;

        they are optional only because a caller applying a rule with no

        mined candidate behind it (hand-typed) has none to carry.


        Each metric''s range mirrors what :mod:`trellis.learning.tag_evolution`

        computes it from -- ``support`` is a document count (``ge=0``),

        ``precision`` is ``support / keyword_documents`` (``ge=0, le=1``), and

        ``lift`` is ``precision / base_rate`` (``ge=0``, unbounded above).

        ``allow_inf_nan=False`` on the two floats refuses a raw ``NaN``/

        ``Infinity`` a scripted client can still send even though

        ``json.dumps`` never emits one by default -- without it, a float

        field happily accepts either and REST answers 400 from deeper in

        the pipeline instead of a clean 422 at the boundary.

        :class:`~trellis.mutate.handlers.ClassifyRuleApplyHandler` re-checks

        the same ranges itself before any write

        (``_validate_classify_rule_metrics``), so a caller that reaches the

        handler directly -- the CLI, a direct ``MutationExecutor.execute``

        -- is refused the same way even without this field; it buys REST

        callers a cheaper, more specific error, not the only backstop.'
      properties:
        key:
          title: Key
          type: string
        kind:
          title: Kind
          type: string
        lift:
          anyOf:
          - minimum: 0.0
            type: number
          - type: 'null'
          title: Lift
        precision:
          anyOf:
          - maximum: 1.0
            minimum: 0.0
            type: number
          - type: 'null'
          title: Precision
        source_event_id:
          title: Source Event Id
          type: string
        support:
          anyOf:
          - minimum: 0.0
            type: integer
          - type: 'null'
          title: Support
        target:
          title: Target
          type: string
      required:
      - kind
      - key
      - target
      - source_event_id
      title: ClassifyRuleApplyRequest
      type: object
    ClassifyRuleListResponse:
      additionalProperties: false
      description: 'Effective tag/domain rules, defaults and config.yaml included.


        ``store_degradation`` is the overrides store''s own

        ``LoadDegradation.to_dict()`` (``None`` when the file loaded clean) --


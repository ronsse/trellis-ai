          title: Reachable
        sample_size:
          default: 0
          title: Sample Size
          type: integer
        status:
          title: Status
          type: string
        tool_name:
          anyOf:
          - type: string
          - type: 'null'
          title: Tool Name
        tuner:
          title: Tuner
          type: string
        unreachable_reasons:
          items:
            type: string
          title: Unreachable Reasons
          type: array
      required:
      - proposal_id
      - tuner
      - status
      - component_id
      title: TunerProposalSummary
      type: object
    ValidationError:
      properties:
        ctx:
          title: Context
          type: object
        input:
          title: Input
        loc:
          items:
            anyOf:
            - type: string
            - type: integer
          title: Location
          type: array
        msg:
          title: Message
          type: string
        type:
          title: Error Type
          type: string
      required:
      - loc
      - msg
      - type
      title: ValidationError
      type: object
    VersionResponse:
      additionalProperties: false
      description: 'Response body for ``GET /api/version``.


        Used by SDK clients on first call to enforce compatibility:


        * Reject when ``api_major`` differs from the client''s expected major.

        * Warn when ``api_minor`` is older than the client''s expected minor.

        * Reject when the client''s own version is below ``sdk_min``.


        ``package_version`` is informational only — it''s the actual

        installed ``trellis-ai`` package version, which may move without

        changing the API contract.


        ``write_provenance`` is the write-provenance stamp this server puts

        on every event it emits (build identity + the write-behaviour

        environment it was launched with).  It exists so an operator can ask

        a *running container* what it is, rather than inferring it from

        whatever image was last built.  Free-form: it mirrors

        ``metadata.write_provenance`` on stored events, whose shape is owned

        by :mod:`trellis.core.write_provenance`, not by the wire contract.

        ``None`` means the server withheld it — it is ops detail, gated like

        the ``/readyz`` breakdown — not that the server cannot report it.


        ``write_behaviour_settings`` is gated identically (``None`` under the

        same withholding) but, unlike ``write_provenance``, is read fresh on

        every call rather than cached once per process: a settings-store

        override can change between two calls with no restart in between.

        Each row is one :meth:`trellis.core.write_config.WriteBehaviourConfig.describe`

        entry — ``name``, ``env_var``, ``value``, ``default``, ``overridden``,

        and ``overridden_by`` (``"env"`` / ``"settings"`` / ``"default"``).'
      properties:
        api_major:
          title: Api Major
          type: integer
        api_minor:
          title: Api Minor
          type: integer
        api_version:
          title: Api Version
          type: string
        mcp_tools_version:
          default: 1
          title: Mcp Tools Version
          type: integer
        package_version:
          title: Package Version
          type: string
        sdk_min:
          title: Sdk Min
          type: string
        wire_schema:
          title: Wire Schema
          type: string
        write_behaviour_settings:
          anyOf:
          - items:
              additionalProperties: true
              type: object
            type: array
          - type: 'null'
          title: Write Behaviour Settings
        write_provenance:
          anyOf:
          - additionalProperties: true
            type: object
          - type: 'null'
          title: Write Provenance
      required:
      - api_major
      - api_minor
      - api_version
      - wire_schema
      - sdk_min
      - package_version
      title: VersionResponse
      type: object
    WithholdingResponse:
      additionalProperties: false
      description: Pack withholding telemetry exposed without item content.
      properties:
        by_reason:
          additionalProperties:
            type: integer
          title: By Reason
          type: object
        class_prior_detail:
          items:
            $ref: '#/components/schemas/ClassPriorWithheldDetail'
          title: Class Prior Detail
          type: array
        non_absence_reasons:
          items:
            type: string
          title: Non Absence Reasons
          type: array
        section_filtered:
          title: Section Filtered
          type: integer
        served_count:
          title: Served Count
          type: integer
        total:
          title: Total
          type: integer
        withheld_item_ids:
          items:
            type: string
          title: Withheld Item Ids
          type: array
      required:
      - total
      - by_reason
      - withheld_item_ids
      - non_absence_reasons
      - section_filtered
      - served_count
      title: WithholdingResponse
      type: object
  securitySchemes:
    APIKeyHeader:
      in: header
      name: Authorization
      type: apiKey
info:
  description: Structured memory and learning for AI agents
  title: Trellis API
  version: 0.2.0
openapi: 3.1.0
paths:
  /api/v1/admin/jobs:
    get:
      description: 'List every catalog job, joined with its schedule row and last-run status.


        A job always appears here even with no schedule-registry row yet

        (materialized with catalog defaults — see ``_job_row_or_default``);

        this route never creates one. ``dispatcher_seen``/

        ``dispatcher_last_seen_at`` answer the UI''s "no dispatcher reporting"

        banner from the EventLog''s own ``JOB_RUN_STARTED`` events, never a

        hardcoded literal. ``store_degradation`` surfaces a degraded schedule

        store the same way ``routes/policies.py`` does, so the UI can show a

        banner instead of silently rendering catalog defaults as if they were

        stored, operator-chosen values (gate #860, blocker 1).'
      operationId: list_admin_jobs_api_v1_admin_jobs_get
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AdminJobListResponse'
          description: Successful Response
      security:
      - APIKeyHeader: []
      summary: List Admin Jobs
      tags:
      - admin
  /api/v1/admin/jobs/{name}:
    patch:
      description: 'Edit a catalog job''s mutable schedule fields.


        The writable surface is exactly ``enabled``, ``cadence`` (cron-

        validated) and ``timeout_seconds`` (bounded 1..86400) —

        ``AdminJobPatchRequest``''s only fields, with ``extra="forbid"``

        refusing anything else. ``name`` must already be a

        :data:`trellis.schedule.catalog.JOB_CATALOG` key (404 otherwise);

        this route never creates or deletes a job. Only fields the caller

        actually set (``body.model_fields_set``) are changed — omitting a

        field leaves it unchanged; an empty body is a no-op that writes

        nothing and emits no event. A write while the schedule store is

        degraded or stale is refused with 409 and the store''s own error

        text. Every applied change emits ``SCHEDULE_UPDATED`` with ``old``/

        ``new`` dicts (only the fields that changed) and the caller''s

        identity.'
      operationId: patch_admin_job_api_v1_admin_jobs__name__patch
      parameters:
      - in: path
        name: name
        required: true
        schema:
          title: Name
          type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AdminJobPatchRequest'
        required: true
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AdminJobPatchResponse'
          description: Successful Response
        '422':
          content:
            application/json:
              schema:
                anyOf:
                - $ref: '#/components/schemas/DefaultValidationError'
                - $ref: '#/components/schemas/StringDetailError'
                title: Response 422 Patch Admin Job Api V1 Admin Jobs  Name  Patch
          description: '``body`` fails ``AdminJobPatchRequest`` validation (DefaultValidationError -- ``detail`` is a list
            of field errors), or the schedule-update command is REJECTED for a reason other than a degraded/stale store (StringDetailError
            -- ``detail`` is a plain string; see ``_schedule_result_http_error``).'
      security:
      - APIKeyHeader: []
      summary: Patch Admin Job
      tags:
      - admin
  /api/v1/admin/jobs/{name}/run:
    post:
      description: 'Request an out-of-band run of a catalog job ("Run now").


        Writes only ``run_requested_at`` on the schedule-registry row — this

        route never executes the job inline and never claims to.

        :func:`trellis.core.cron.is_job_due` treats a ``run_requested_at``

        newer than the job''s last completed run as always due, so a host

        dispatcher polling ``due-jobs`` on its own cadence (typically within

        ~5 minutes, if one is installed at all — see

        ``docs/ops/job-dispatcher.sh.example``) is what actually picks the

        job up from there. ``name`` must already be a

        :data:`trellis.schedule.catalog.JOB_CATALOG` key (404 otherwise). A

        write while the schedule store is degraded or stale is refused with

        409 and the store''s own error text. Emits ``JOB_RUN_REQUESTED`` with

        the caller''s identity.'
      operationId: run_admin_job_api_v1_admin_jobs__name__run_post
      parameters:
      - in: path
        name: name
        required: true
        schema:
          title: Name
          type: string
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AdminJobRunResponse'
          description: Successful Response
        '422':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StringDetailError'
          description: The job-run-request command is REJECTED for a reason other than a degraded/stale store -- ``detail``
            is a plain string (see ``_schedule_result_http_error``).
      security:
      - APIKeyHeader: []
      summary: Run Admin Job
      tags:
      - admin
  /api/v1/advisories:
    get:
      description: List stored advisories.
      operationId: list_advisories_api_v1_advisories_get
      parameters:
      - description: Filter by scope
        in: query
        name: scope
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          description: Filter by scope
          title: Scope
      - description: Minimum confidence
        in: query
        name: min_confidence
        required: false
        schema:
          default: 0.0
          description: Minimum confidence
          title: Min Confidence
          type: number
      responses:
        '200':
          content:
            application/json:
              schema:
                additionalProperties: true
                title: Response List Advisories Api V1 Advisories Get
                type: object
          description: Successful Response
        '422':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
          description: Validation Error
      security:
      - APIKeyHeader: []
      summary: List Advisories
      tags:
      - admin
  /api/v1/advisories/generate:
    post:
      description: 'Generate advisories from outcome data.


        Analyzes PACK_ASSEMBLED and FEEDBACK_RECORDED events to find patterns,

        then stores deterministic advisories for delivery alongside packs.


        Every arm that wrote nothing answers 409, never 200, and names itself

        with a `code`. Two of the three carry it at the top level beside

        `status` — `degraded_store` and `stores_dir_unconfigured`. The third,

        `stale_store_write`, carries it under `detail`: that arm has answered

        409 since #438 and its body shape is deliberately unchanged here, so

        a client reading all three wants `.code // .detail.code`.'
      operationId: generate_advisories_api_v1_advisories_generate_post
      parameters:
      - description: Days of history to analyze
        in: query
        name: days
        required: false
        schema:
          default: 30
          description: Days of history to analyze
          title: Days
          type: integer
      - description: Min sample size; defaults to the configured setting
        in: query
        name: min_sample
        required: false
        schema:
          anyOf:
          - type: integer
          - type: 'null'
          description: Min sample size; defaults to the configured setting
          title: Min Sample
      - description: Min effect size; defaults to the configured setting
        in: query
        name: min_effect
        required: false
        schema:
          anyOf:
          - type: number
          - type: 'null'
          description: Min effect size; defaults to the configured setting
          title: Min Effect
      responses:
        '200':
          content:
            application/json:
              schema:
                additionalProperties: true
                title: Response Generate Advisories Api V1 Advisories Generate Post
                type: object
          description: Successful Response
        '409':
          description: 'Nothing was generated and nothing was written: the advisory store loaded degraded, the file changed
            under the request, or the deployment has no stores_dir. A `code` says which — `degraded_store` and `stores_dir_unconfigured`
            at the top level beside `status`, `stale_store_write` under `detail`, which is the shape that arm has answered
            since #438.'
        '422':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
          description: Validation Error
      security:
      - APIKeyHeader: []
      summary: Generate Advisories
      tags:
      - admin
  /api/v1/analyze:
    get:
      description: 'List the reports available under ``GET /api/v1/analyze/{report}``.


        ``params_schema`` is each report''s params DTO as JSON Schema

        (``params_model.model_json_schema()``) — the same bounds

        (``minimum``/``maximum``/``exclusiveMinimum``/``exclusiveMaximum``),

        types (``integer``/``number``/``boolean``/``string``) and, where a

        field restricts to a fixed set (``outcome`` on the holdout report),

        ``enum`` that ``GET /api/v1/analyze/{report}`` itself enforces. A

        client renders a typed control from this instead of a plain text box

        per param.'
      operationId: list_analyze_reports_api_v1_analyze_get
      responses:
        '200':
          content:
            application/json:
              schema:
                additionalProperties: true
                title: Response List Analyze Reports Api V1 Analyze Get
                type: object
          description: Successful Response
      security:
      - APIKeyHeader: []
      summary: List Analyze Reports
      tags:
      - analyze
  /api/v1/analyze/{report}:
    get:
      description: 'Run one allowlisted ``trellis analyze`` report over HTTP.


        Query params are validated against the report''s own bounded DTO

        (``extra="forbid"``) rather than FastAPI''s automatic pydantic-model

        binding, because that binding does not reject an unrecognized query

        key — only a manual parse does.'
      operationId: get_analyze_report_api_v1_analyze__report__get
      parameters:
      - in: path
        name: report
        required: true
        schema:
          title: Report
          type: string
      responses:
        '200':
          content:
            application/json:
              schema: {}
          description: Successful Response
        '422':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
          description: Validation Error
      security:
      - APIKeyHeader: []
      summary: Get Analyze Report
      tags:
      - analyze
  /api/v1/classify/candidates:
    get:
      description: 'Recent tag/domain candidates, deduped to each one''s latest emission.


        Never invokes a miner — see ``POST /classify/candidates/mine`` for

        that. A candidate already present in the overlay reads ``applied``;

        one with a more recent ``CLASSIFY_CANDIDATE_DISMISSED`` than its

        latest surfacing reads ``dismissed``; otherwise ``open``.'
      operationId: list_classify_candidates_api_v1_classify_candidates_get
      parameters:
      - description: Max candidate events to scan per kind. Never triggers mining.
        in: query
        name: limit
        required: false
        schema:
          default: 500
          description: Max candidate events to scan per kind. Never triggers mining.
          maximum: 5000
          minimum: 1
          title: Limit
          type: integer
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ClassifyCandidateListResponse'
          description: Successful Response
        '422':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
          description: Validation Error
      security:
      - APIKeyHeader: []
      summary: List Classify Candidates
      tags:
      - classify
  /api/v1/classify/candidates/mine:
    post:
      description: 'Run the tag-keyword / domain-alias miners and emit candidate events.


        Reuses :func:`trellis.learning.tag_evolution.analyze_tag_keyword_candidates`

        and :func:`trellis.learning.domain_normalization.analyze_domain_alias_candidates`

        directly — the same functions ``trellis classify tag-candidates`` /

        ``domain-candidates`` call — rather than re-implementing the mining

        logic here. Admin-scoped: unlike the read-only listing, this touches

        the corpus scan and, on a missing threshold with

        ``use_recommended_defaults=true``, mines under un-reviewed defaults.'
      operationId: mine_classify_candidates_api_v1_classify_candidates_mine_post
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ClassifyMineRequest'
        required: true
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ClassifyMineResponse'
          description: Successful Response
        '422':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
          description: Validation Error
      security:
      - APIKeyHeader: []
      summary: Mine Classify Candidates
      tags:
      - classify
  /api/v1/classify/candidates/{candidate_id}/dismiss:
    post:
      description: 'Mark a candidate dismissed — no store write, audit trail only.


        ``CLASSIFY_CANDIDATE_DISMISSED`` carries no dedicated ``Operation``:

        a dismiss changes no state ``MutationExecutor`` governs, only this

        event stream (see the ``EventType`` member''s own docstring), the same

        posture :attr:`~trellis.stores.base.event_log.EventType.JOB_RUN_STARTED`

        has. ``GET /classify/candidates`` excludes a dismissed candidate from

        its "open" listing unless it resurfaces with a newer emission.'
      operationId: dismiss_classify_candidate_api_v1_classify_candidates__candidate_id__dismiss_post
      parameters:
      - in: path
        name: candidate_id
        required: true
        schema:
          title: Candidate Id
          type: string
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ClassifyCandidateDismissResponse'
          description: Successful Response
        '422':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
          description: Validation Error
      security:
      - APIKeyHeader: []
      summary: Dismiss Classify Candidate
      tags:
      - classify
  /api/v1/classify/rules:
    get:
      description: 'Every effective tag-keyword / domain-alias rule, badged by source.


        ``source`` is ``"overlay"`` when the exact ``(kind, key) -> target``

        triple is an applied row in ``classify_overrides.json``, ``"config"``

        when it instead comes from ``config.yaml``, and ``"default"`` for the

        shipped built-ins otherwise (no built-in alias defaults exist today,

        so that branch is defensive for aliases). The badging itself is

        :func:`~trellis.classify.factory.effective_classify_rule_rows`,

        shared with ``trellis classify effective-rules`` so the precedence

        logic lives in one place.

        ``registry.domain_keyword_map()`` / ``domain_alias_map()`` already

        resolve the full precedence (defaults < config.yaml < overlay,

        overlay merged additively per domain) — this route only re-derives

        *which* layer won, never a second merge.'
      operationId: list_classify_rules_api_v1_classify_rules_get
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ClassifyRuleListResponse'
          description: Successful Response
      security:
      - APIKeyHeader: []
      summary: List Classify Rules
      tags:
      - classify
    post:
      description: 'Apply one mined candidate into the operator overlay.


        Routes through ``Operation.CLASSIFY_RULE_APPLY`` — the same governed

        path ``trellis classify apply-rule`` uses — so a denying policy blocks

        both surfaces identically (Stage 2 always runs, CLAUDE.md). The

        candidate''s own metrics (``support``/``precision``/``lift``) are

        carried through onto the audit event so a reviewer never has to join

        back to the original ``TAG_KEYWORD_CANDIDATE`` / ``DOMAIN_ALIAS_CANDIDATE``

        event to see what was approved.'
      operationId: apply_classify_rule_api_v1_classify_rules_post
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ClassifyRuleApplyRequest'
        required: true
      responses:
        '200':
          content:
            application/json:
              schema:
                title: Response Apply Classify Rule Api V1 Classify Rules Post
          description: Successful Response
        '422':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
          description: Validation Error
      security:
      - APIKeyHeader: []
      summary: Apply Classify Rule
      tags:
      - classify
  /api/v1/classify/rules/{kind}/{key}:
    delete:
      description: 'Revoke one applied rule from the operator overlay.


        Refused (400) when ``(kind, key)`` has no overlay row — including

        when the rule comes from ``config.yaml`` instead, which this was

        never written by and cannot un-apply; see

        ``ClassifyRuleRevokeHandler``''s own docstring for the two distinct

        refusal messages.'
      operationId: revoke_classify_rule_api_v1_classify_rules__kind___key__delete
      parameters:
      - in: path
        name: kind
        required: true
        schema:
          title: Kind
          type: string
      - in: path
        name: key
        required: true
        schema:
          title: Key
          type: string
      responses:
        '200':
          content:
            application/json:
              schema:
                title: Response Revoke Classify Rule Api V1 Classify Rules  Kind   Key  Delete
          description: Successful Response
        '422':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
          description: Validation Error
      security:
      - APIKeyHeader: []
      summary: Revoke Classify Rule
      tags:
      - classify
  /api/v1/code-proposals:
    get:
      description: 'List recent ``PROPOSAL_DRAFTED`` events with their markdown preview.


        Read-only surface — the Review view shows these for visibility but

        exposes no action. Mirrors the read in ``trellis admin

        list-proposals`` / ``show-proposal``.'
      operationId: list_code_proposals_api_v1_code_proposals_get
      parameters:
      - description: Max PROPOSAL_DRAFTED events to return
        in: query
        name: limit
        required: false
        schema:
          default: 50
          description: Max PROPOSAL_DRAFTED events to return
          maximum: 500
          minimum: 1
          title: Limit
          type: integer
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CodeProposalListResponse'
          description: Successful Response
        '422':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
          description: Validation Error
      security:
      - APIKeyHeader: []
      summary: List Code Proposals
      tags:
      - admin
  /api/v1/commands/batch:
    post:
      description: 'Execute a batch of mutation commands through the governed pipeline.


        Supported strategies:


        - ``sequential`` — execute all, never stop early.

        - ``stop_on_error`` — halt on the first ``FAILED`` or ``REJECTED``.

        - ``continue_on_error`` — execute all, include errors in results.


        A batch containing any operation outside

        :data:`~trellis.mutate.NON_DESTRUCTIVE_OPERATIONS` (merges, redactions,

        retention prune, alias rebinds, link/label removal, schedule/settings/

        classify-rule writes) is refused whole, with no command executed, unless

        the caller''s key carries the ``admin`` scope. ``requested_by`` is

        derived from the authenticated principal when one is present (see

        :func:`trellis_api.routes._principal.resolve_requested_by`); the

        body''s own claim rides along as each command''s

        ``metadata["requested_by_claim"]``.


        A command''s own ``metadata`` is otherwise free-form decoration, with

        one exception: it may not name a key reserved for server-side audit

        stamping (``requested_by_claim``, ``key_id``, ``key_name``,

        ``write_provenance``, ``handler_warnings`` --

        :data:`~trellis.mutate.RESERVED_COMMAND_METADATA_KEYS`). The batch''s

        own ``metadata`` (``CommandBatch.metadata``, distinct from any one

        command''s) carries the same restriction, even though nothing reads it

        yet. Either one naming a reserved key refuses the whole batch with

        400, naming the key, before any command executes.'
      operationId: execute_batch_api_v1_commands_batch_post
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/BatchCommandRequest'
        required: true
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BatchCommandResponse'
          description: Successful Response
        '400':
          description: A command's own ``metadata``, or the batch's own ``metadata``, named a key reserved for server-side
            audit stamping (``requested_by_claim``, ``key_id``, ``key_name``, ``write_provenance``, ``handler_warnings``);
            ``detail`` names the key.
        '403':
          description: The batch names an operation outside NON_DESTRUCTIVE_OPERATIONS and the caller's key lacks the admin
            scope.
        '422':
          content:
            application/json:
              schema:
                anyOf:
                - $ref: '#/components/schemas/BatchCommandBodyError'
                - $ref: '#/components/schemas/BatchOperationNameError'
                title: Response 422 Execute Batch Api V1 Commands Batch Post
          description: A pydantic body-validation failure (BatchCommandBodyError -- ``detail`` is a list of field errors),
            or a command names an operation outside the Operation enum (BatchOperationNameError -- ``detail`` is a plain string
            naming the bad value; see ``_parse_operation``).

  /api/v1/vectors:
    post:
      description: 'Batch upsert vectors into the vector store.


        Body: ``{"vectors": [{"item_id": "...", "vector": [...], "metadata": {...}}, ...]}``


        **What is judged before any write.** Every row is checked in a first pass

        and any refusal in it stores nothing from the batch. A row that is not an

        object, whose ``item_id`` is present but not a string, or whose ``metadata``

        is neither an object nor ``null``, is a 422. So is a ``metadata`` that would

        break a semantic read: ``content`` or ``excerpt`` that is not a string,

        ``auto_importance`` that is not a finite number (a bool is not one), or an

        ``auto_importance`` at or above the importance decay threshold with no

        ``importance_scored_at`` (in ``metadata`` or ``metadata.content_tags``). So

        is a ``vector`` that is not a list of finite numbers (a bool is not one)

        within float32 range, one whose squared length would overflow float32 in the

        store''s norm, or one whose length differs from the store''s width (when the

        store declares one; the SQLite backend does not, and then the batch''s first

        non-empty vector sets the width the rest must match). So is an ``item_id``

        starting ``trace-summary:``, for every caller: that namespace is the

        trace-embed worker''s, and a row there makes it skip the trace for good. A

        row''s ``metadata`` may not carry a raw ``data_classification`` (422), whoever

        the caller is: a vector row''s label is mirrored from its document, never set

        here. A row whose ``item_id`` names no stored document may not carry

        ``metadata.lifecycle`` or ``metadata.evidence_ref`` (422): the pack builder

        withholds by id, so those keys would act on whatever item holds that id.

        A row whose ``item_id`` is a document (or a chunk of one) above the key''s

        clearance is refused (409): replacing its vector row would replace what a

        semantic hit shows and carries.


        **What is not atomic.** The second pass writes row by row. A row with no

        ``item_id`` (absent, ``null`` or empty) or no ``vector`` (absent, ``null`` or

        empty) is counted in ``errors`` and stored as nothing. So is a row whose

        document read or upsert fails, which does not stop the rest: a batch can

        answer ``upserted: 1, errors: 1`` with the first row stored. Nothing makes

        the mirror below atomic with a concurrent relabel either: if the relabel''s

        own vector sync runs between this route''s read of the document and its upsert,

        this upsert overwrites the synced row, and it stays stale until a later sync

        or ``trellis admin resync-vector-metadata``.


        When ``item_id`` names a stored document the row is written carrying that

        document''s mirrored metadata (its label and lifecycle among them) and its

        ``evidence_ref``, for every caller, whatever the row''s own ``metadata`` says.

        For a chunk id (``<parent>#chunk-<digits>``) ``parent_doc_id`` is the chunk

        document''s own, else the parent the id names, whatever the row supplied; for

        any other id it is kept as supplied.'
      operationId: upsert_vectors_api_v1_vectors_post
      requestBody:
        content:
          application/json:
            schema:
              additionalProperties: true
              title: Body
              type: object
        required: true
      responses:
        '200':
          content:
            application/json:
              schema:
                additionalProperties: true
                title: Response Upsert Vectors Api V1 Vectors Post
                type: object
          description: Successful Response
        '422':
          content:
            application/json:
              schema:
                anyOf:
                - $ref: '#/components/schemas/DefaultValidationError'
                - $ref: '#/components/schemas/StringDetailError'
                title: Response 422 Upsert Vectors Api V1 Vectors Post
          description: The body isn't a JSON object at all (DefaultValidationError -- ``detail`` is a list of field errors),
            or it is one but fails the route's own schema validation (StringDetailError -- ``detail`` is a plain string naming
            the problem).
      security:
      - APIKeyHeader: []
      summary: Upsert Vectors
      tags:
      - ingest
  /api/v1/vectors/reset:
    post:
      description: 'Drop and recreate the vectors table with current configured dimensions.


        No failure arm answers 200, and they do not all answer the same

        status. **409** is the answer whenever nothing was dropped and

        nothing was recreated and the fix is to the deployment rather than to

        the request — either the deployment has **no vector store

        configured** (`vector_store_unconfigured`), or it has one whose

        **backend this route cannot reset** (`vector_reset_unsupported_backend`;

        ArcadeDB and Neo4j keep vectors as graph-node state, so there is no

        `vectors` table here to drop). A reset that was **attempted and

        failed** answers **500** (`vector_reset_failed`): the server fell over

        mid-operation, the vectors table may be gone, and no reshaped request

        fixes that.


        A 409 on this route is a *permanent* answer, not "try again later" —

        same as the `advisories/generate` refusals next door, the condition

        does not resolve on its own. It is 4xx rather than 501 because nothing

        broke: the server declined correctly, and a 5xx at this boundary means

        the server failed.


        All three refusals name themselves in a `code` at the **top level** of

        the body, beside `status`. This route raises no `HTTPException`, so

        there is no `detail` envelope on any arm and `body["code"]` is always

        where the code is.'
      operationId: reset_vectors_api_v1_vectors_reset_post
      responses:
        '200':
          content:
            application/json:
              schema:
                additionalProperties: true
                title: Response Reset Vectors Api V1 Vectors Reset Post
                type: object
          description: Successful Response
        '409':
          description: 'Nothing was dropped and nothing was recreated, and what has to change is the deployment rather than
            the request. A `code` says which — `vector_store_unconfigured` when the deployment has no vector store, `vector_reset_unsupported_backend`
            when it has one this route cannot reset — a backend that does not implement `reset_storage()` (ArcadeDB and Neo4j
            decline because they hold vectors as graph-node state and keep no `vectors` table of their own), or an object
            that does not implement the vector-store interface at all. Both sit at the top level beside `status`, and neither
            is transient: retrying an unchanged request cannot succeed.'
        '500':
          description: The reset was attempted and failed. The vectors table may have been dropped and not recreated, so this
            is not a no-op the way the 409 is. `code` is `vector_reset_failed`, at the top level beside `status`, and `message`
            carries the sanitized backend error.
      security:
      - APIKeyHeader: []
      summary: Reset Vectors
      tags:
      - admin
  /api/version:
    get:
      description: 'Return API version metadata for client compatibility checks.


        SDK clients call this on first use.  The compatibility fields are

        static — no IO, no store access — so it''s cheap to poll and stays

        public.


        ``write_provenance`` — the build identity and write-behaviour

        environment this server stamps onto every event it emits — is ops

        detail, and is gated exactly like the ``/readyz`` backend breakdown:

        authenticated callers get it, and so does everyone when the effective

        auth mode is permissive or ``TRELLIS_OPS_DETAIL=public``.  A container

        image that has drifted from the host working tree is otherwise

        invisible, and the deployments that most need to see it are the

        unauthenticated dev/LAN ones; a deployment that has chosen

        ``TRELLIS_AUTH_MODE=required`` gets to keep its commit sha and enabled

        ingest behaviours off an anonymous response.


        An image built by ``make docker-build`` cannot drift — code and

        metadata are frozen together — so the stamp''s ``stamp_stale`` /

        ``source_tree_commit`` keys are absent here in the deployment shape

        this route was written for.  They appear when the API is served from

        an editable install whose working tree has moved on.


        ``write_behaviour_settings`` is gated the same way, for the same

        reason — a knob''s ``overridden_by`` sits beside its env-sourced

        counterpart in ``write_provenance.env_flags``, so splitting the gate

        between them would publish half the same fact.  Unlike

        ``write_provenance`` (a stamp frozen once per process) this is read

        fresh from ``<data_dir>/stores/settings.json`` on every call, same as

        ``trellis admin write-config`` — this process''s container may have

        no store configured at all, in which case every row reports

        ``"env"``/``"default"`` and never ``"settings"``.'
      operationId: api_version_api_version_get
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/VersionResponse'
          description: Successful Response
      security:
      - APIKeyHeader: []
      summary: Api Version
      tags:
      - version
      - version

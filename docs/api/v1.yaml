  /api/v1/documents:
    get:
      description: 'List or search documents, returning previews only.


        A document above the key''s clearance is absent: no row, id, title or

        preview, and ``total`` does not count it (#194). ``DocumentStore`` has no

        label predicate, so a key below ``restricted`` is served by scanning the

        store in batches from the start, keeping the rows of the requested page.

        The scan stops at the first readable row past the page. If it finds one,

        ``total`` is ``offset + limit + 1`` and ``total_exact`` is ``false``: there

        is at least one more page, which is all a pager needs, and nothing past

        that is counted. If the store runs out first, ``total`` is the exact count

        of readable rows. Either way the response depends only on the rows the key

        can read; counts are approximate below ``restricted``. A key below

        ``restricted`` may not ask for an ``offset`` above 10000 (400): the scan''s

        cost grows with it, so narrow the list with ``q`` or use a key with the

        ``restricted`` scope, which reads the store directly and has no ceiling.

        The scan still walks past rows the key cannot read, so its cost grows with

        the store, not only with the page.


        A row whose ``lifecycle.superseded_by``, ``supersedes_doc_id`` or

        ``updates_doc_id`` names a document the key may not read is served without

        that id.


        ``<parent>#chunk-N`` fragment rows are excluded by default; pass

        ``include_chunks=true`` for the unfiltered listing. ``total`` is

        counted under the same filter as the rows, and the applied setting is

        echoed back on the response.


        A search (``q`` set) is paged the same way the unfiltered list is:

        ``offset`` and ``limit`` both apply to the matches. Nothing in

        ``DocumentStore`` counts a query''s total matches or offsets into them,

        so this captures the first matches once and pages that capture in

        Python, never more than 2000 of them: ``total`` is clipped to 2000 and a

        query with that many readable matches reports ``total_exact: false``. For

        a key that cannot read everything the capture is widened (to at most 32

        times) until it holds 2000 readable matches, so one hidden match does not

        move ``total``. Past that widening bound a residual count leak is

        unavoidable: a capture still short of 2000 readable matches reports the

        readable ones it holds, a count that depends on how many hidden matches

        ranked ahead of them, with ``total_exact: false``.'
      operationId: list_documents_api_v1_documents_get
      parameters:
      - description: Full-text search query
        in: query
        name: q
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          description: Full-text search query
          title: Q
      - description: Max results
        in: query
        name: limit
        required: false
        schema:
          default: 50
          description: Max results
          maximum: 500
          minimum: 1
          title: Limit
          type: integer
      - description: Offset, applied to search results too
        in: query
        name: offset
        required: false
        schema:
          default: 0
          description: Offset, applied to search results too
          minimum: 0
          title: Offset
          type: integer
      - description: 'Include <parent>#chunk-N fragment rows. Excluded by default: they are slices of documents already in
          the list.'
        in: query
        name: include_chunks
        required: false
        schema:
          default: false
          description: 'Include <parent>#chunk-N fragment rows. Excluded by default: they are slices of documents already
            in the list.'
          title: Include Chunks
          type: boolean
      responses:
        '200':
          content:
            application/json:
              schema:
                additionalProperties: true
                title: Response List Documents Api V1 Documents Get
                type: object
          description: Successful Response
        '400':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StringDetailError'
          description: A key below `restricted` asked for an `offset` past the ceiling its filtered scan allows; narrow the
            list with `q` or use a key with the `restricted` scope.
        '422':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
          description: Validation Error
      security:
      - APIKeyHeader: []
      summary: List Documents
      tags:
      - explore
    post:
      description: 'Write a document to the document store for FTS retrieval.


        Accepts: ``{"doc_id": "...", "content": "...", "metadata": {...},

        "sensitivity": "...", "reingest_redacted": false}``


        An optional ``sensitivity`` labels the stored document, under the rules of

        ``POST /evidence`` and MCP ``save_memory``: the key needs that clearance

        itself (403 otherwise), and an unknown label, or a raw

        ``data_classification`` in ``metadata``, is a 422. Nothing is written in

        either case.


        A ``doc_id`` that already exists is refused (409) when the stored

        document''s label is above the key''s clearance, or above the label this

        write carries: a re-put replaces the row, so it must not destroy or

        downgrade content the caller may not read.


        An optional boolean ``reingest_redacted`` says the write is meant to bring a

        redacted ``doc_id`` back (#1034), under the rules of ``POST /evidence``:

        without it a write to one is refused (400) and nothing is written, and a

        value that is not a boolean is a 422. It is no way past the clearance rule above.

        A reused ``idempotency_key`` answers as the write it first named, so a

        flagged retry needs a fresh one.'
      operationId: create_document_api_v1_documents_post
      requestBody:
        content:
          application/json:
            schema:
              additionalProperties: true
              title: Body
              type: object
        required: true
      responses:
        '200':
          content:
            application/json:
              schema:
                additionalProperties: true
                title: Response Create Document Api V1 Documents Post
                type: object
          description: Successful Response
        '422':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
          description: Validation Error
      security:
      - APIKeyHeader: []
      summary: Create Document
      tags:
      - curate

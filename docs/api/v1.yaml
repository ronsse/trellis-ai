        Reuses the ``/readyz`` probe set (``probe_backends``) so this

        versioned-API view can never read healthy while ``/readyz`` reads

        degraded — before this, ``checks`` was a hard-coded literal that

        never touched a store.'
      operationId: health_api_v1_health_get
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HealthResponse'
          description: Successful Response
      security:
      - APIKeyHeader: []
      summary: Health
      tags:
      - admin
  /api/v1/ingest/bulk:
    post:
      description: "Bulk ingest entities, edges, and aliases in one request.\n\nEntities, edges, and aliases flow through\
        \ the governed mutation pipeline\n(validation, policy, idempotency, execution, and audit emission).\n\nStrategies:\n\
        \n- ``continue_on_error`` *(default)* -- run every item, report per-item\n  status. Suited for backfill where partial\
        \ success is acceptable.\n- ``stop_on_error`` -- halt at the first FAILED/REJECTED result and\n  skip remaining items,\
        \ including later groups.\n- ``sequential`` -- behaves like ``continue_on_error`` (errors don't\n  halt); kept for\
        \ consistency with ``/commands/batch``.\n\nProcessing order is entities → edges → aliases (downstream groups\nreference\
        \ entities, so entities must land first).\n\nA request carrying any ``aliases`` is refused whole, with nothing\nexecuted,\
        \ unless the caller's key carries the ``admin`` scope: alias\nrebinds are ``alias.upsert``, a :data:`~trellis.mutate.DESTRUCTIVE_OPERATIONS`\n\
        member, and this route must require the same scope the equivalent\ncommand needs through ``/commands/batch`` rather\
        \ than letting the\nrouter-level ``ingest`` scope stand in for it.\n\n``requested_by`` is derived from the authenticated\
        \ principal when one\nis present (see\n:func:`trellis_api.routes._principal.resolve_requested_by`), the same\nrule\
        \ ``/commands/batch`` applies -- a mutate-scoped caller cannot\nstamp an arbitrary ``requested_by`` onto a bulk-ingested\
        \ entity or\nedge. The body's own claim rides along as each command's\n``metadata[\"requested_by_claim\"]``."
      operationId: ingest_bulk_api_v1_ingest_bulk_post
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/BulkIngestRequest'
        required: true
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BulkIngestResponse'
          description: Successful Response
        '403':
          description: The request carries aliases but the caller's key lacks the admin scope -- alias.upsert is a destructive
            operation (see requires_admin_scope) and requires the same scope here as it does through /commands/batch.
        '422':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
          description: Validation Error
      security:
      - APIKeyHeader: []
      summary: Ingest Bulk
      tags:
      - ingest
  /api/v1/learning/candidates:
    get:
      description: 'Serve the most-recent ``intent_learning_candidates.json`` artifact.


        ``trellis worker curate`` and ``trellis analyze learning-candidates``

        write it, by default to ``TRELLIS_LEARNING_ARTIFACTS_DIR`` when set and

        otherwise to ``<data_dir>/learning``, the directory this route reads;

        ``artifacts_dir`` names it. When there is nothing to serve (the

        directory or the file is missing, the file is unreadable, or no

        directory can be resolved), the answer is still 200 but carries

        ``status="error"``, a ``code`` saying which, and a ``hint`` naming the

        path, so an unwritten artifact never reads as an empty review queue.


        Each candidate dict gets a server-computed ``promotable`` boolean —

        ``recommendation_type in PROMOTE_RECOMMENDATIONS``, the same set

        :func:`prepare_learning_promotions` checks before submitting a

        promotion — so a UI (or any other caller) can gate its own Approve

        control on that field instead of re-deriving the rule.'
      operationId: list_learning_candidates_api_v1_learning_candidates_get
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LearningCandidateListResponse'
          description: Successful Response
      security:
      - APIKeyHeader: []
      summary: List Learning Candidates
      tags:
      - admin
  /api/v1/learning/promotions:
    post:
      description: 'Promote approved learning candidates through the governed pipeline.


        Builds the decisions payload from the request body, joins it against

        the most-recent candidate artifact (read from the directory

        ``GET /learning/candidates`` serves) via

        :func:`trellis.learning.prepare_learning_promotions`, then submits

        each approved promotion as ``ENTITY_CREATE`` + per-target

        ``LINK_CREATE`` commands through :class:`MutationExecutor` — exactly

        the path ``trellis curate promote-learning`` uses. A

        ``REVIEW_DECISION_RECORDED`` event records the reviewer identity.


        The response''s ``status`` is the verdict ``promote-learning`` states,

        from the same function (:func:`promotion_verdict`), and the status code

        stays 200 for every verdict. An approved row with a blank

        ``candidate_id`` is skipped but makes the verdict ``refused``; rows that

        promoted still landed. A row whose precedent is already current, complete

        and unchanged comes back ``already_promoted`` and is written not at all,

        so re-submitting a decision (or a whole file) adds no version and no

        second ``PRECEDENT_PROMOTED`` event. A precedent a redaction already took

        comes back ``refused_redacted`` and is not written back. So does a row

        whose source document was redacted, when its name is one the redacted text

        gave it (the source''s text or its own title): a candidate or a decision''s

        ``promotion_name`` kept from before the redaction, or edited from it, since

        a name that contains an earlier name''s distinctive text is refused too.

        Regenerate the candidate (and clear that name) to promote it again. Once the

        source id was written again with new content, a name derived from that

        content and a reviewer''s own title promote; only a name the precedent

        carried at or before the redaction stays refused.'
      operationId: promote_learning_candidates_api_v1_learning_promotions_post
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LearningPromotionRequest'
        required: true
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LearningPromotionResponse'
          description: Successful Response
        '409':
          description: 'Nothing was promoted: there is no learning-candidate artifact to join the decisions against. `detail.code`
            says why (`learning_artifacts_dir_missing`, `learning_candidates_missing`, `learning_candidates_unreadable` or
            `stores_dir_unconfigured`), `detail.path` names the directory or file at fault and `detail.message` how to produce
            it.'
        '422':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
          description: Validation Error
      security:
      - APIKeyHeader: []
      summary: Promote Learning Candidates
      tags:
      - admin
